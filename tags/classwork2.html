<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <table border="1" cellpadding="15px">
        <th colspan="3"> Registration form</th>

        <tr>
            <th>
                <label for="full name">Full Name </label>
            </th>
            <td colspan="2"> <input type="text" id="full name">
            </td>
        </tr>
        <tr>
            <th>
                <label for="username">Username</label>
            </th>
            <td colspan="2">
                <input type="text" id="username">
            </td>
        </tr>

        <tr>
            <th>
                <label for="password">Password</label>
            </th>
            <td colspan="2"> <input type="password" id="password">
            </td>
        </tr>

        <tr>
            <th>
                <label for="dob">Date of Birth</label>
            </th>
            <td colspan="2"> <input type="date" id="dob">
            </td>
        </tr>

        <tr>
            <th> Qualification</th>
            <td colspan="3">
                1.A.<i>Secondary</i><br>
                2.B.<i>Higher Secondary</i><br>
                3.C.<i>Bachelors</i><br>
                4.D.<i>Master</i><br>
                5.E.<i>Others</i><br>
            </td>
        </tr>

        <tr>
            <th rowspan="2">
                Personal details
            </th>
            <th>
                Subscript
            </th>
            <th> Superscript</th>
        </tr>
        <tr>
            <td> H<sub>2</sub>O</sub></td>
            <td> X <sup>2</sup></td>
        </tr>

        <tr>
            <th>
                Text formatiing
            </th>
            <td colspan="2"> <b> Bold text</b> <br> <i> Ilatic text </i></td>
        </tr>

        <tr>
            <th> Website</th>
            <td colspan="2"> <a href="https//:www.google.com">Visit Google </a></td>
        </tr>

        <tr>
            <th colspan="3">
                <button> register </button><button> Reset</button>
            </th>
        </tr>



    </table>

</body>

</html>
